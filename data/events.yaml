# Steam events and big game releases that compete for attention.
# Hand-maintained. Every entry has a source; add new ones the same way.
#
# type:
#   seasonal_sale  Steam Lunar New Year, Spring, Summer, Autumn, Winter sales
#   next_fest      Steam Next Fest (demo festival)
#   themed_fest    Valve-run themed fests (third-party events are left out)
#   aaa_release    big releases; on_steam_at_launch says if PC players could buy it on Steam that day
# start, end: calendar dates in Pacific time, both inclusive. Steam events start at 10:00 Pacific.
# confidence: high = official Steam source or several reliable sources agree;
#             medium = one reliable source; low = not confirmed, see note.
#
# Sources, in order of preference:
#   1. Steamworks "Upcoming Events" page: https://partner.steamgames.com/doc/marketing/upcoming_events
#      (archived snapshots on web.archive.org for past dates)
#   2. Steam and Steamworks news posts (store.steampowered.com/news/...)
#   3. Publisher pages and reputable press for game release dates
# SteamDB is not scraped. It may be read by hand to spot-check a date.
#
# AAA entries whose date was only a year or season ("2027") are left out
# until a real date is announced.

