# Steam events, major releases and holidays that can shift player attention.
# Hand-maintained. Check with:  python -m pipeline.events [--check-steam _data]
#
# Every entry: name, type, start, end, confidence, source (https), optional note.
#
# type
#   seasonal_sale     Valve's seasonal sales (Lunar New Year until 2022, then Spring,
#                     Summer, Autumn, Winter). Steam-wide.
#   next_fest         Steam Next Fest, the demo festival. Steam-wide discovery event.
#   themed_fest       Valve-run themed fests. `tags`: the Steam tags the fest covers,
#                     when Valve's fest page or announcement names them.
#                     Third-party events (LudoNarraCon, Cozy Games Celebration, ...) are left out.
#   major_release     big launches that compete for attention. Extra fields:
#                       on_steam_at_launch  true if PC players could buy or play it on Steam that day;
#                                           false means it competes for attention, not Steam purchases
#                       release_kind        full | early_access | early_access_exit | expansion
#                                           (remakes, remasters and PC ports count as full)
#                       steam_appid         the Steam app (the DLC's own app for expansions), if any
#                       free_to_play        true only for free-to-play launches (no purchase competition)
#                       surprise            shadow_drop = date public less than 2 weeks ahead;
#                                           breakout = little pre-launch attention, became a hit after.
#                                           Leave these out when planning around known releases.
#   regional_holiday  holidays that move players in one region. `region`: CN, US, or global
#                     (the Western Christmas to New Year season). Other regions are left out for now.
#
# Dates are Pacific calendar dates.
#   - Steam-run events (seasonal_sale, next_fest, themed_fest) start at 10:00 Pacific on
#     `start` and end at 10:00 Pacific on `end`: `end` is the day it ends, not the last full day.
#   - Releases are one day: the day the game became available in Pacific time. For games on
#     Steam at launch this is the day it unlocked on Steam (often the evening before the
#     official worldwide date); the official date is in the note when it differs.
#   - Holidays cover whole days, `start` to `end` inclusive.
#
# confidence is about the date and facts, not about impact:
#   high = official source, or several reliable sources agree; medium = one reliable source;
#   low = not confirmed, see note. There are no impact scores: overlapping an event does not
#   mean it caused a change in a game's numbers.
#
# Sources, in order of preference: Steamworks "Upcoming Events" page and Steam news posts;
# Steam store data; publisher and platform announcements; reputable press.
# SteamDB is not scraped. It may be read by hand to spot-check a date.
#
# Releases with only a year or season announced ("2027") are left out until dated.

