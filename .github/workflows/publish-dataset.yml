name: publish dataset

# Weekly: publish the data branch as Parquet on Hugging Face, each time the
# collect history run ends (scheduled or manual, failed or not: it saves its
# progress either way). Starting from that run, not from a cron of its own,
# keeps the order when GitHub delays schedules (9 hours on 2026-10-12).
# The gp/ folder in the dataset is written by the daily job and left alone here.
#
# Off by default. Needs:
#   secret   HF_TOKEN          Hugging Face token with write access to the dataset
#   variable HF_DATASET_REPO   e.g. <user>/steam-launch-data
#   variable PUBLISH_DATASET=on  to let the history run start the upload
# A manual run is a dry run unless "upload" is ticked: it builds the files and
# attaches them to the run so they can be checked first.

on:
  workflow_run:
    workflows: ["collect history"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Hugging Face (otherwise build only)"
        type: boolean
        default: false

concurrency:
  group: data-branch
  cancel-in-progress: false
  queue: max  # wait in line instead of cancelling a waiting run

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' || (vars.PUBLISH_DATASET == 'on'
      && contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[publish]"

      - name: Build (dry run)
        if: github.event_name == 'workflow_dispatch' && !inputs.upload
        env:  # read only: to list the gp/ configs on the card
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: python -m pipeline.publish_dataset --dry-run
      - name: Attach the built files to this run
        if: github.event_name == 'workflow_dispatch' && !inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: dataset-preview
          path: .cache/dataset
          include-hidden-files: true
          retention-days: 7

      - name: Build and upload
        if: github.event_name == 'workflow_run' || inputs.upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: python -m pipeline.publish_dataset
