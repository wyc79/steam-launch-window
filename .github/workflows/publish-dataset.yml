name: publish dataset

# Weekly: publish the data branch as Parquet on Hugging Face, each time a
# collect history run on main ends, whatever its result: it saves its progress
# even when it fails or times out, and a run skipped because COLLECT_HISTORY is
# off still starts the weekly upload. Starting from that run, not from a cron
# of its own, keeps the order when GitHub delays schedules (9 hours on 2026-10-12).
# The manifest check below still stops an upload of a broken build.
# The gp/ folder in the dataset is written by the daily job and left alone here;
# its CSV files are downloaded and copied to gp_parquet/, which the dataset
# viewer can show.
#
# Off by default. Needs:
#   secret   HF_TOKEN          Hugging Face token with write access to the dataset
#   variable HF_DATASET_REPO   e.g. <user>/steam-launch-data
#   variable PUBLISH_DATASET=on  to let the history run start the upload
# A manual run is a dry run unless "upload" is ticked: it builds the files and
# attaches them to the run so they can be checked first.

on:
  workflow_run:
    workflows: ["collect history"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Hugging Face (otherwise build only)"
        type: boolean
        default: false

concurrency:
  group: data-branch
  cancel-in-progress: false
  queue: max  # wait in line instead of cancelling a waiting run

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_DATASET == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[publish]"

      - name: Download the Games Popularity files
        if: vars.HF_DATASET_REPO != ''
        env:  # the token is only for the higher rate limit: runners share IPs
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          for kind in followers players; do
            python -m pipeline.hf_sync fetch --repo "$HF_DATASET_REPO" --dest _hf \
              --glob "gp/$kind/*.csv.gz" --allow-none
          done

      - name: Build (dry run)
        if: github.event_name == 'workflow_dispatch' && !inputs.upload
        run: python -m pipeline.publish_dataset --gp-dir _hf/gp --dry-run
      - name: Attach the built files to this run
        if: github.event_name == 'workflow_dispatch' && !inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: dataset-preview
          path: .cache/dataset
          include-hidden-files: true
          retention-days: 7

      - name: Build and upload
        if: github.event_name == 'workflow_run' || inputs.upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: python -m pipeline.publish_dataset --gp-dir _hf/gp
