name: model

# Weekly: fit the launch model (analysis/model.py) each time a collect history
# run on main ends, whatever its result (it saves its progress even when it
# fails), and commit its model.json to the data branch as site/model.json, so
# the daily site build reuses it instead of fitting the model every day.
#
# The model's follower control needs the Games Popularity follower series, so
# this downloads every gp/followers/*.csv.gz from the public Hugging Face
# dataset (anonymous read). Those files grow daily: about 0.7 MB a day now, so
# roughly 250 MB after a year. A per-game cache of the series can replace the
# full download when that gets too slow.
#
# Off by default. Needs:
#   variable MODEL_RUN=on        to let the history run start the model
#   variable HF_DATASET_REPO     the public dataset with gp/followers/
# A manual run (Run workflow button) always runs it. Run from another branch, it
# fits that branch's code but does not commit (the commit step is main only).
# While MODEL_RUN is off, each history run still starts this workflow: the job is
# skipped, but the run waits its turn in the data-branch queue like any other.

on:
  workflow_run:
    workflows: ["collect history"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false
  queue: max  # wait in line instead of cancelling a waiting run

jobs:
  model:
    if: github.event_name == 'workflow_dispatch' || vars.MODEL_RUN == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[analysis,hf]"

      - name: Games Popularity follower series
        env:
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          python -m pipeline.hf_sync fetch --repo "$HF_DATASET_REPO" --dest "$RUNNER_TEMP/hf" \
            --glob "gp/followers/*.csv.gz"
      - name: Fit the model
        run: python -m analysis.model --data-dir _data --gp-dir "$RUNNER_TEMP/hf/gp" --out _data/site
      - name: Commit model.json
        if: github.ref == 'refs/heads/main'  # a test run from a feature branch must not reach the data branch
        run: scripts/commit_data.sh "model $(date -u +%F)"
