name: collect history

# Weekly: relist games released since 2022, fill first-30-day review counts
# for games whose window closed since the last run, and check new launches
# for hidden Early Access. The backfill is done outside Actions; this job
# only does increments.
#
# Off by default. Set the repository variable COLLECT_HISTORY=on to let the
# schedule run it. Do not turn it on (or run it by hand) until the backfill's
# games.csv is on the data branch, or it will redo the backfill here.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Time budget"
        default: "300"

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.COLLECT_HISTORY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - name: Refuse to start without the backfill
        run: |
          test -f _data/history/games.csv || {
            echo "history/games.csv is not on the data branch yet; finish the backfill first"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: python -m pipeline.collect_history --store-interval 2 --budget-minutes "${{ inputs.budget_minutes || '300' }}"
      - name: Commit history
        if: always()  # keep progress saved before a failure or timeout
        run: scripts/commit_data.sh "history $(date -u +%F)"
