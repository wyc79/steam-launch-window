name: collect history

# Weekly: relist games released since 2022 and fill first-30-day review
# counts for games whose window has closed since the last run.
# The backfill was done locally; this job only does increments.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: python -m pipeline.collect_history --budget-minutes 300
      - run: scripts/commit_data.sh "history $(date -u +%F)"
