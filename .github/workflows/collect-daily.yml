name: collect daily

# Daily: snapshot every coming-soon game, then refresh follower counts that
# are due under the tiered schedule (see pipeline/collect_followers.py).
# The full first scrape was done locally; this job only does increments.

on:
  schedule:
    - cron: "30 18 * * *"  # after Steam's 10:00 Pacific store updates
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .

      - name: Upcoming snapshot
        run: python -m pipeline.collect_upcoming
      - run: scripts/commit_data.sh "upcoming snapshot $(date -u +%F)"

      - name: Follower counts
        run: python -m pipeline.collect_followers --budget-minutes 200
      - run: scripts/commit_data.sh "followers $(date -u +%F)"
