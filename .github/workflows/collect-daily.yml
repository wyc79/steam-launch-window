name: collect daily

# Daily: snapshot every coming-soon game, then pull follower and player history
# from Games Popularity within its daily budget (see pipeline/collect_gp.py).
# A second, later schedule is a catch-up: it skips the snapshot if today's is
# already saved with working wishlist ranks, so a dropped or failed 18:30 run
# (including a failed wishlist crawl) is retried once.
#
# Off by default. Repository variables (Settings > Secrets and variables >
# Actions > Variables) turn parts on:
#   COLLECT_DAILY=on      let the schedule run this job
#   COLLECT_GP=on         include the Games Popularity step in scheduled runs
#   HF_DATASET_REPO       the public Hugging Face dataset; Games Popularity data lives under gp/ there
#   GP_DAILY_BUDGET       requests per day (default 900)
# Secrets: GP_API_KEY, HF_TOKEN (write access to HF_DATASET_REPO).
# The step refuses to start without gp/state.csv in the dataset, so a lost state
# cannot restart every pull from scratch. For a first run, upload a gp/state.csv
# that holds only its header line (see STATE_FIELDS in pipeline/collect_gp.py).
# The step also keeps gp/latest_followers.csv (the newest count per game) for the
# site build; when it is missing, the step downloads every followers file to build it
# (a new dataset has none yet, so it starts from this run's points).
# A manual run (Run workflow button) does the snapshot and asks whether to
# include Games Popularity.

on:
  schedule:
    - cron: "30 18 * * *"  # after Steam's 10:00 Pacific store updates
    - cron: "47 21 * * *"  # catch-up
  workflow_dispatch:
    inputs:
      gp:
        description: "Also pull Games Popularity followers and players"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false
  queue: max  # wait in line instead of cancelling a waiting run

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.COLLECT_DAILY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GP_ON: ${{ inputs.gp || (github.event_name == 'schedule' && vars.COLLECT_GP == 'on') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - name: Is today's snapshot already saved, with wishlist ranks?
        id: today
        run: |
          day=$(date -u +%F)
          # ranking_ok is the last column of runs.csv
          if [ -f "_data/upcoming/snapshots/$day.csv.gz" ] && grep -q "^$day,.*,1$" _data/upcoming/runs.csv 2>/dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[hf]"

      - name: Upcoming snapshot
        if: steps.today.outputs.done != 'true'
        run: exec python -m pipeline.collect_upcoming --store-interval 2
      - name: Commit snapshot
        if: always() && steps.today.outputs.done != 'true'  # keep whatever was saved, even if the collector failed
        run: scripts/commit_data.sh "upcoming snapshot $(date -u +%F)"

      - name: Games Popularity
        if: ${{ !cancelled() && env.GP_ON == 'true' }}  # runs even if the snapshot failed: it does not need ranks
        env:
          GP_API_KEY: ${{ secrets.GP_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          GP_DAILY_BUDGET: ${{ vars.GP_DAILY_BUDGET }}
        run: |
          day=$(date -u +%F)
          python -m pipeline.hf_sync pull --repo "$HF_DATASET_REPO" --dest _hf --require gp/state.csv \
            --file gp/runs.csv --file gp/latest_followers.csv \
            --file "gp/followers/$day.csv.gz" --file "gp/players/$day.csv.gz"
          build=""
          if [ ! -f _hf/gp/latest_followers.csv ]; then
            # first run with the file: the collector builds it from every day's followers file,
            # fetched at the pulled revision (unchanged files are left out of the push);
            # --allow-none: a new dataset has no followers file yet (other errors still fail)
            python -m pipeline.hf_sync fetch --repo "$HF_DATASET_REPO" --dest _hf \
              --revision "$(cat _hf/.hf_parent)" --glob "gp/followers/*.csv.gz" --allow-none
            build=--build-latest
          fi
          # exec: a cancel or timeout signals the step's shell; this way it reaches the collector,
          # which then saves its progress and today's request count before exiting
          exec python -m pipeline.collect_gp --data-dir _data --gp-dir _hf/gp $build
      - name: Save Games Popularity data
        if: always() && env.GP_ON == 'true'  # keep progress even if the collector stopped early
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          if [ -f _hf/.hf_parent ]; then  # only after a complete pull
            python -m pipeline.hf_sync push --repo "$HF_DATASET_REPO" --src _hf --message "gp $(date -u +%F)"
          fi
